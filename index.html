<!DOCTYPE html>
<html>
<head>
<title>Barishal Online Varieties Shop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#dfe6e9;
}
.header{
  background:#2ecc71;
  color:white;
  padding:40px;
  text-align:center;
  font-size:42px;
  font-weight:bold;
}
#title{ font-size:20px; }
.info-bar{
  text-align:center;
  margin-bottom:20px;
  font-size:18px;
}
.pay{
  display:inline-block;
  padding:6px 14px;
  margin:5px;
  border-radius:20px;
  color:white;
  font-weight:bold;
}
.bkash{ background:#e84393; }
.rocket{ background:#8e44ad; }
.nagad{ background:#f39c12; }
.upay{ background:#2ecc71; }
.center{
  text-align:center;
  margin-top:50px;
}
.btn{
  background:#27ae60;
  color:white;
  border:none;
  padding:12px 25px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}
.input-box{
  padding:12px;
  margin:10px;
  width:260px;
  border-radius:8px;
  border:1px solid #ccc;
}
table{
  width:90%;
  margin:20px auto;
  border-collapse:collapse;
}
th{
  background:#2ecc71;
  color:white;
  padding:12px;
}
td{
  background:white;
  padding:10px;
  text-align:center;
}
.delete{
  background:red;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:6px;
}
.back{
  position:absolute;
  top:20px;
  left:20px;
  background:red;
  color:white;
  padding:8px 14px;
  border:none;
  border-radius:8px;
}
.summary{
  background:#2ecc71;
  color:white;
  padding:20px;
  width:300px;
  margin:20px auto;
  border-radius:12px;
}
.org{
  background:#27ae60;
  color:white;
  text-align:center;
  padding:12px;
  margin:20px auto;
  width:fit-content;
  border-radius:12px;
}
.hide{ display:none; }
</style>
</head>

<body>

<div class="header">
🛒 Barishal Online Varieties Shop
<br><small id="title">Login System</small>
</div>

<div class="info-bar">
📞 24-Hour Helpline: 01789-283860<br><br>
💳 Payment:
<span class="pay bkash">bKash</span>
<span class="pay rocket">Rocket</span>
<span class="pay nagad">Nagad</span>
<span class="pay upay">Upay</span>
</div>

<!-- LOGIN -->
<div class="center" id="login">
  <button class="btn" onclick="setRole('user')">👤 User</button>
  <button class="btn" onclick="setRole('admin')">🔒 Admin</button><br>

  <p id="showRole" style="font-weight:bold; color:#ffffff;"></p>

  <input type="password" id="pass" class="input-box" placeholder="🔑 Enter Password"><br>
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- USER PANEL -->
<div id="userPanel" class="hide">
<button class="back" onclick="back()">← Back</button>

<div class="center">
<h2>📋 Data Entry</h2>

<input id="name" class="input-box" placeholder="👤 Name"><br>
<input id="product" class="input-box" placeholder="📦 Product"><br>
<input id="amount" class="input-box" placeholder="💰 Amount"><br>

<select id="type" class="input-box">
<option value="income">💵 Income</option>
<option value="expense">💸 Expense</option>
</select><br>

<button class="btn" onclick="saveData()">Submit</button>
</div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hide">
<button class="back" onclick="back()">← Back</button>

<div class="center">
<h2>📊 Admin Dashboard</h2>
</div>

<table>
<tr>
<th>👤 Name</th>
<th>📦 Product</th>
<th>💰 Amount</th>
<th>📊 Type</th>
<th>📅 Date</th>
<th>❌ Delete</th>
</tr>

<tbody id="table"></tbody>
</table>

<div class="summary">
💰 Income: <span id="income">0</span><br>
💸 Expense: <span id="expense">0</span><br>
📊 Balance: <span id="balance">0</span>
</div>

<div class="org">
🏫 Organization: Nahida Begum Computer Training Centre
</div>

</div>

<!-- 🔥 FIREBASE SCRIPT -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCTQVjJDvASpwCS0DqO4ZGrFn2OPS2FwYM",
  authDomain: "borishal-online-varieties.firebaseapp.com",
  databaseURL: "https://borishal-online-varieties-default-rtdb.firebaseio.com/",
  projectId: "borishal-online-varieties",
  storageBucket: "borishal-online-varieties.appspot.com",
  messagingSenderId: "957306151653",
  appId: "1:957306151653:web:b6129b4c7237978acfea0c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.setRole = function(r){
  window.role = r;
  document.getElementById("showRole").innerText =
    (r=="user") ? "👤 User Selected" : "🔒 Admin Selected";
};

window.login = function(){
  let p = document.getElementById("pass").value;

  if(role=="user" && p=="1111"){
    document.getElementById("login").style.display="none";
    document.getElementById("userPanel").style.display="block";
    document.getElementById("adminPanel").style.display="block";
    loadData();
  }
  else if(role=="admin" && p=="1234"){
    document.getElementById("login").style.display="none";
    document.getElementById("adminPanel").style.display="block";
    loadData();
  }
  else{
    alert("Wrong Password!");
  }
};

window.back = function(){
  location.reload();
};

window.saveData = function(){

  let name = document.getElementById("name").value;
  let product = document.getElementById("product").value;
  let amount = document.getElementById("amount").value;
  let type = document.getElementById("type").value;

  if(name=="" || product=="" || amount==""){
    alert("সব ঘর পূরণ করুন");
    return;
  }

  push(ref(db, "data"), {
    name, product, amount, type,
    date: new Date().toLocaleString()
  });

  document.getElementById("name").value="";
  document.getElementById("product").value="";
  document.getElementById("amount").value="";
};

window.loadData = function(){
  onValue(ref(db, "data"), (snapshot)=>{
    let data = snapshot.val();

    let t="";
    let income=0, expense=0;

    if(data){
      for(let id in data){
        let d = data[id];

        t+=`
        <tr>
        <td>${d.name}</td>
        <td>${d.product}</td>
        <td>${d.amount}</td>
        <td>${d.type}</td>
        <td>${d.date}</td>
        <td>
  ${window.role === "admin" ? `<button class="delete" onclick="delData('${id}')">Delete</button>` : ""}
</td>
        </tr>
        `;

        if(d.type=="income") income+=Number(d.amount);
        else expense+=Number(d.amount);
      }
    }

    document.getElementById("table").innerHTML=t;
    document.getElementById("income").innerText=income;
    document.getElementById("expense").innerText=expense;
    document.getElementById("balance").innerText=income-expense;
  });
};

window.delData = function(id){
  if(prompt("Enter Admin Password:")=="1234"){
    remove(ref(db, "data/" + id));
  }
};

loadData();

</script>

</body>
</html>
